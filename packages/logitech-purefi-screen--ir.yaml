substitutions:
  ir_rx_pin: GPIO0

remote_receiver:
  id:   ir_rx
  pin: 
    number: ${ir_rx_pin}
    inverted: true
    mode:
      input: true

  dump: 
    - nec
    - samsung
    - panasonic


infrared:
  - platform: ir_rf_proxy
    name: IR Receiver
    # receiver_frequency: 38kHz
    remote_receiver_id: ir_rx

script:
  - id: ir_recognized_blink
    mode: restart
    then:
      - light.turn_on:
          id: rgb_front_led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%
      - delay: 50ms
      - light.turn_off: rgb_front_led

binary_sensor:
  - platform: remote_receiver
    name: "Samsung Play/Pause"
    samsung:
      data: 0xE0E036C9
    on_press: &ir_recognized_action
      - script.execute: ir_recognized_blink

  - platform: remote_receiver
    name: "Samsung Stop"
    samsung:
      data: 0xE0E028D7
    on_press: *ir_recognized_action

  - platform: remote_receiver
    name: "Samsung Vol Down"
    samsung:
      data: 0xE0E0A857
    on_press: *ir_recognized_action

  - platform: remote_receiver
    name: "Samsung Vol Up"
    samsung:
      data: 0xE0E06897
    on_press: *ir_recognized_action

  - platform: remote_receiver
    name: "NEC power"
    nec:
      address: 0xFE01
      command: 0xBF40
    on_press: *ir_recognized_action

  - platform: remote_receiver
    name: "NEC play/pause"
