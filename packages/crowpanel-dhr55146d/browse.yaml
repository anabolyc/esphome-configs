# ============================================================
# Browse page: lists of things to play or trigger
# ============================================================
# - Knob hold (side button): step forward through the cycle
#   player -> lists -> other screens (browse::screens(), e.g.
#   packages/crowpanel-dhr55146d/lights.yaml) -> player. A horizontal
#   swipe walks the same cycle either way; see
#   packages/crowpanel-dhr55146d/touch-actions.yaml.
# - Knob turn (left / right): move the selection up / down
# - No input for ${browse_timeout}: back to the player
# - Knob press (middle): act on the selected item through Home Assistant,
#   then go back to the player. What it does depends on the list
#   (browse::Action): play a stream on sendspin_resume_entity, or trigger
#   an automation.
#
# Content packages add lists at boot (somafm-stations.yaml,
# ambient-scenes.yaml); the knob hold visits them in the order the
# packages are included.
#
# The list is virtual: a few fixed rows are refilled as the selection
# moves, so the item count does not cost LVGL memory.
#
# Requires:
#   - packages/crowpanel-dhr55146d/browse_list.h and at least one
#     content package
#   - a UI package: packages/crowpanel-dhr55146d/sendspin-addon-display.yaml
#     with packages/crowpanel-dhr55146d/sendspin-addon-knob.yaml.
#     It provides the LVGL setup, fonts (font_display, font_time), the
#     lv_rgb565a8_enabler image, the browse_active global and the
#     ui_show_home and loading_show scripts.
#   - substitution sendspin_resume_entity
# ============================================================

# Override in the device config substitutions
substitutions:
  # A list or any other secondary screen goes back to the player after this
  # long with no input at all. Not meant to be switched off; set it to
  # something long if you want a screen to stay put.
  browse_timeout: 60s

esphome:
  includes:
    - packages/crowpanel-dhr55146d/browse_list.h

globals:
  # Target of the selected item, for the Home Assistant action data. ESPHome
  # 2026.10 generates data lambdas before the includes, so they cannot call
  # browse:: functions directly; globals are declared early enough.
  - id: browse_target
    type: std::string
    restore_value: no

script:
  # Move delta stops round the cycle: the player, then every list, then every
  # screen, then the player again. The knob hold passes 1; a swipe passes 1 or
  # -1 (packages/crowpanel-dhr55146d/touch-actions.yaml).
  - id: browse_step
    parameters:
      delta: int
    then:
      - lambda: |-
          const int lists = browse::lists().size();
          const int screens = browse::screens().size();
          // Stop 0 is the player; the lists and then the screens follow it
          const int stops = 1 + lists + screens;
          int &list = browse::current();
          int &screen = browse::current_screen();
          int pos = list >= 0 ? 1 + list : (screen >= 0 ? 1 + lists + screen : 0);
          if (screen >= 0 && browse::screens()[screen].hide)
            browse::screens()[screen].hide();
          // Wraps in both directions, so -1 from the player lands on the last screen
          pos = ((pos + delta) % stops + stops) % stops;
          list = (pos >= 1 && pos <= lists) ? pos - 1 : -1;
          screen = (pos > lists) ? pos - 1 - lists : -1;
          ESP_LOGD("browse", "Step %+d to stop %d of %d (list %d, screen %d)", delta, pos, stops - 1,
                   list, screen);
      - if:
          condition:
            lambda: return browse::current() >= 0;
          then:
            - globals.set:
                id: browse_active
                value: 'true'
            - script.execute: browse_render
            - lvgl.page.show: browse_page
          else:
            - if:
                condition:
                  lambda: return browse::current_screen() >= 0;
                then:
                  - globals.set:
                      id: browse_active
                      value: 'true'
                  - lambda: browse::screens()[browse::current_screen()].show();
                else:
                  - script.execute: browse_close

  - id: browse_close
    then:
      - lambda: |-
          int &screen = browse::current_screen();
          if (screen >= 0 && browse::screens()[screen].hide)
            browse::screens()[screen].hide();
          screen = -1;
          browse::current() = -1;
      - globals.set:
          id: browse_active
          value: 'false'
      # Back to whatever the UI package shows by default
      - script.execute: ui_show_home

  # Restarted by every input (see the handlers below and
  # packages/crowpanel-dhr55146d/touch-actions.yaml). When it runs out, the
  # player comes back.
  #
  # The browse_active check is in here rather than at the nine call sites, so
  # each input costs one line: an input on the player arms the timer too, and
  # 60s later it finds nothing open and does nothing. For the same reason
  # browse_close does not stop it - a leftover timer is already harmless, and
  # stopping it there would mean this script cancelling itself mid-run.
  - id: browse_idle_timer
    mode: restart
    then:
      - delay: ${browse_timeout}
      - if:
          condition:
            lambda: return id(browse_active);
          then:
            - logger.log: "No input for ${browse_timeout}, going back to the player"
            - script.execute: browse_close

  - id: browse_move
    parameters:
      delta: int
    then:
      - lambda: |-
          browse::List *list = browse::current_list();
          if (list == nullptr || list->items.empty())
            return;
          const int n = list->items.size();
          list->selected = (list->selected + delta + n) % n;
      - script.execute: browse_render

  - id: browse_select
    then:
      - if:
          condition:
            lambda: return browse::selected_item() != nullptr;
          then:
            - logger.log:
                format: "Selected %s"
                args: ['browse::selected_item()->title']
            - lambda: id(browse_target) = browse::selected_item()->target;
            - if:
                condition:
                  lambda: return browse::current_list()->action == browse::Action::PLAY_MEDIA;
                then:
                  - script.execute: loading_show
                  - homeassistant.action:
                      action: media_player.play_media
                      data:
                        entity_id: ${sendspin_resume_entity}
                        media_content_type: music
                        media_content_id: !lambda return id(browse_target);
                      on_success:
                        - logger.log: "Home Assistant started playback"
                      on_error:
                        - logger.log:
                            level: WARN
                            format: "Home Assistant could not start playback: %s"
                            args: [error.c_str()]
                else:
                  - homeassistant.action:
                      action: automation.trigger
                      data:
                        entity_id: !lambda return id(browse_target);
                      on_success:
                        - logger.log: "Home Assistant triggered the automation"
                      on_error:
                        - logger.log:
                            level: WARN
                            format: "Home Assistant could not trigger the automation: %s"
                            args: [error.c_str()]
            - script.execute: browse_close

  # Fill the fixed rows around the selected item of the open list
  - id: browse_render
    then:
      - lambda: |-
          static constexpr int ROWS = 5;
          browse::List *list = browse::current_list();
          if (list == nullptr)
            return;
          auto &items = list->items;
          const int n = items.size();
          if (list->selected >= n)
            list->selected = 0;
          const int sel = list->selected;
          const int start = std::max(0, std::min(sel - ROWS / 2, n - ROWS));

          lv_obj_t *rows[ROWS] = {id(browse_row_0), id(browse_row_1), id(browse_row_2), id(browse_row_3), id(browse_row_4)};
          lv_obj_t *icons[ROWS] = {id(browse_icon_0), id(browse_icon_1), id(browse_icon_2), id(browse_icon_3), id(browse_icon_4)};
          lv_obj_t *glyphs[ROWS] = {id(browse_glyph_0), id(browse_glyph_1), id(browse_glyph_2), id(browse_glyph_3), id(browse_glyph_4)};
          lv_obj_t *labels[ROWS] = {id(browse_label_0), id(browse_label_1), id(browse_label_2), id(browse_label_3), id(browse_label_4)};

          for (int i = 0; i < ROWS; i++) {
            const int idx = start + i;
            if (idx >= n) {
              lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            const browse::Item &item = items[idx];
            lv_obj_remove_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(labels[i], item.title);
            if (item.icon != nullptr) {
              lv_image_set_src(icons[i], item.icon->get_lv_image_dsc());
              lv_obj_remove_flag(icons[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(glyphs[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              if (item.glyph_font != nullptr)
                lv_obj_set_style_text_font(glyphs[i], item.glyph_font->get_lv_font(), 0);
              lv_label_set_text(glyphs[i], item.glyph != nullptr ? item.glyph : "");
              lv_obj_remove_flag(glyphs[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(icons[i], LV_OBJ_FLAG_HIDDEN);
            }
            lv_obj_set_style_bg_opa(rows[i], idx == sel ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
          }

          lv_label_set_text(id(browse_title_label), list->title);
          char pos[12];
          snprintf(pos, sizeof(pos), "%d/%d", n == 0 ? 0 : sel + 1, n);
          lv_label_set_text(id(browse_position_label), pos);

# Turning navigates on press while a list is open; holding the knob cycles
# lists and screens. The regular button actions skip while browse_active is set
# (a list or a screen is open).
binary_sensor:
  - id: !extend left_button_sensor
    on_press:
      - script.execute: browse_idle_timer
      - if:
          condition:
            lambda: return browse::current() >= 0;
          then:
            - script.execute:
                id: browse_move
                delta: -1
  - id: !extend right_button_sensor
    on_press:
      - script.execute: browse_idle_timer
      - if:
          condition:
            lambda: return browse::current() >= 0;
          then:
            - script.execute:
                id: browse_move
                delta: 1
  # Added after sendspin-addon-buttons.yaml's handler, which skips while a list is open
  - id: !extend middle_button_sensor
    on_click:
      - script.execute: browse_idle_timer
      - if:
          condition:
            lambda: return browse::current() >= 0;
          then:
            - script.execute: browse_select
  - id: !extend side_button_sensor
    on_click:
      # Runs before the step below, so entering a screen starts the timer
      - script.execute: browse_idle_timer
      # Everything here goes through Home Assistant, so WiFi is all that is needed
      - if:
          condition:
            or:
              - lambda: return id(browse_active);
              - wifi.connected:
          then:
            - script.execute:
                id: browse_step
                delta: 1

# Round layout: a 360-wide row would be cut off at the top and bottom of the
# circle, so the rows are 260 wide and centred, with the list title on the
# upper arc and the position on the lower one.
lvgl:
  pages:
    - id: browse_page
      bg_color: 0x000000
      skip: true
      scrollbar_mode: "OFF"
      widgets:
        - label:
            id: browse_title_label
            align: TOP_MID
            y: 22
            width: 170
            text_align: CENTER
            long_mode: DOT
            text_color: 0xFFFFFF
            text_font: font_display
            text: ""
        - label:
            id: browse_position_label
            align: BOTTOM_MID
            y: -24
            text_color: 0xAAAAAA
            text_font: font_time
            text: ""
        - obj:
            id: browse_row_0
            align: TOP_MID
            y: 68
            width: 260
            height: 45
            bg_color: 0x303030
            bg_opa: TRANSP
            border_width: 0
            radius: 10
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:
              - image:
                  id: browse_icon_0
                  align: LEFT_MID
                  x: 10
                  src: lv_rgb565a8_enabler
              # Font is set per item at runtime
              - label:
                  id: browse_glyph_0
                  align: LEFT_MID
                  x: 10
                  width: 40
                  text_align: CENTER
                  text_color: 0xFFFFFF
                  text: ""
                  hidden: true
              - label:
