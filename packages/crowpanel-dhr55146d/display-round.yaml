# ============================================================
# CrowPanel 1.46" round HMI display (Elecrow SKU DHR55146D)
# ============================================================
# 360x360 round IPS panel on an ESP32-S3R8. The panel controller is a
# JD9855, which answers to the ST77961 register set; the init sequence
# below is the one LovyanGFX's Panel_ST77961 sends, as used by Elecrow's
# own firmware for this board. ESPHome has no built-in model for it, so
# it goes in as model: CUSTOM.
#
# Taken out of the vendor sequence, because mipi_spi appends them itself:
#   COLMOD (0x3A), CASET/RASET (0x2A/0x2B), SLPOUT (0x11), DISPON (0x29)
#
# Unlike the Radio Box remote, reset and backlight are separate pins here,
# so turning the screen off is just the backlight going dark - no panel
# re-initialisation, and no display_power.h.
#
# Provides:
#   - display s3_box_lcd (same id as packages/display-tft.yaml upstream)
#   - light display_backlight
# ============================================================

substitutions:
  spi_clk_pin: GPIO10
  spi_mosi_pin: GPIO11
  display_cs_pin: GPIO9
  display_dc_pin: GPIO3
  display_reset_pin: GPIO14
  display_backlight_pin: GPIO46
  power_led_pin: GPIO40
  # 80MHz is what the vendor firmware clocks the panel at
  display_data_rate: 80MHz

spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}
  id: spi_bus_display

output:
  # GPIO46 is a strapping pin (boot mode); safe as an output after boot
  - platform: ledc
    id: display_backlight_output
    pin:
      number: ${display_backlight_pin}
      ignore_strapping_warning: true
    frequency: 5000Hz

  # Power indicator next to the knob, active low
  - platform: gpio
    id: power_led_output
    pin:
      number: ${power_led_pin}
      inverted: true

light:
  - platform: monochromatic
    id: display_backlight
    name: "Backlight"
    output: display_backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 150ms

switch:
  - platform: output
    id: power_led
    name: "Power LED"
    icon: mdi:led-on
    entity_category: config
    output: power_led_output
    restore_mode: RESTORE_DEFAULT_ON

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: CUSTOM
    dimensions:
      width: 360
      height: 360
    spi_id: spi_bus_display
    spi_mode: MODE0
    cs_pin: ${display_cs_pin}
    # GPIO3 is a strapping pin (JTAG source select); hardwired to the panel here
    dc_pin:
      number: ${display_dc_pin}
      ignore_strapping_warning: true
    reset_pin: ${display_reset_pin}
    color_order: RGB
    invert_colors: false
    data_rate: ${display_data_rate}
    auto_clear_enabled: false
    update_interval: never
    # JD9855 / ST77961, from LovyanGFX's Panel_ST77961::getInitCommands()
    init_sequence:
    - [0xDE, 0x00]
    - [0xDF, 0x98, 0x55]
    - [0xB2, 0x1F]
    - [0xB7, 0x00, 0x1D, 0x00, 0x45]
    - [0xBB, 0x1B, 0x64, 0xC4, 0x1E, 0x3E, 0xF5]
    - [0xBC, 0x03, 0x20, 0xF3, 0xC0]
    - [0xC0, 0x22, 0xA1]
    - [0xC3, 0x00, 0x02, 0x2A, 0x0B, 0x08, 0x48, 0x08, 0x04, 0x62, 0x30, 0x30]
    - [0xC4, 0x40, 0x00, 0xAD, 0x68, 0x43, 0x07, 0x04, 0x16, 0x43, 0x07, 0x04]
    - [0xC8, 0x3F, 0x36, 0x30, 0x2D, 0x2F, 0x31, 0x2B, 0x2A, 0x27, 0x25, 0x1F, 0x14, 0x10, 0x09, 0x04, 0x00, 0x3F, 0x36, 0x30, 0x2D, 0x2F, 0x31, 0x2B, 0x2A, 0x27, 0x25, 0x1F, 0x14, 0x10, 0x09, 0x04, 0x00]
    - [0xD3, 0x28, 0x13]
    - [0xD9, 0x00, 0x00, 0xFF, 0x00, 0xF0, 0x00]
    - [0xDE, 0x01]
    - [0xB7, 0x13, 0xE7, 0x64, 0x39, 0x06, 0x36, 0x19, 0x1C]
    - [0xBE, 0x00]
    - [0xC1, 0x00, 0x4A, 0x80]
    - [0xC2, 0x00, 0x16, 0xDA, 0xE7]
    - [0xC7, 0x00, 0x00, 0x00, 0x38, 0x08, 0x08, 0x00, 0x01]
    - [0xC8, 0x00, 0x00, 0x00, 0x00, 0x15, 0x3B]
    - [0xC9, 0x00, 0x16, 0x06, 0x04, 0x0A]
    - [0xCA, 0x08, 0x35, 0x16, 0x1F, 0x1F]
    - [0xCB, 0x01, 0x16, 0x07, 0x05, 0x0B]
    - [0xCC, 0x09, 0x35, 0x16, 0x1F, 0x1F]
    - [0xCD, 0x01, 0x16, 0x09, 0x0B, 0x05]
    - [0xCE, 0x07, 0x15, 0x1F, 0x16, 0x1F]
    - [0xCF, 0x00, 0x16, 0x08, 0x0A, 0x04]
    - [0xD0, 0x06, 0x15, 0x1F, 0x16, 0x1F]
    - [0xD1, 0x02, 0x30]
    - [0xD2, 0x02, 0x03, 0x52, 0xDF, 0xDD]
    - [0xD3, 0x3B, 0x04, 0x48]
    - [0xD5, 0x10, 0x10, 0x07, 0x07, 0x0F, 0x94, 0x26]
    - [0xD6, 0x00, 0x00, 0x40]
    - [0xD7, 0x00, 0x00, 0x20]
    - [0xDE, 0x02]
    - [0xB6, 0x1C]
    - [0xDE, 0x00]
    - [0x4D, 0x00]
    - [0x4E, 0x00]
    - [0x4F, 0x00]
    - [0x4C, 0x01]
    - delay 10ms
    - [0x4C, 0x00]
    - [0x35]
    - delay 120ms
