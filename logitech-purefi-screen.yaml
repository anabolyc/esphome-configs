substitutions:
  name: esphome-web-172074
  friendly_name: logitech-purefi-screen
  task_stack_in_psram: "false"

  # ===== Board-Specific Pinouts =====
  # I2S Audio
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_dout_pin: GPIO22

  # RGB LED
  rgb_led_pin: GPIO33
  num_leds: 1

  # IR Receiver
  ir_rx_pin: GPIO0

  # SPI pins (for display)
  spi_clk_pin: GPIO18
  spi_mosi_pin: GPIO23
  spi_miso_pin: GPIO19

  # TFT
  # display_backlight_pin: GPIO32
  display_cs_pin: GPIO05
  display_dc_pin: GPIO04
  display_reset_pin: GPIO32

  # Touch
  touch_cs_pin: GPIO02

  # SDCARD
  sdcard_cs_pin: GPIO27

  # Battery sense pin
  batt_sense_pin: GPIO34
  
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
    - media_player.volume_set:
        id: external_media_player
        volume: 0%

esp32:
  id: esp32_id
  variant: esp32
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: 5.5.4
#    advanced:
#      minimum_chip_revision: "3.1" 
    sdkconfig_options:
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: DEBUG

# Enable Home Assistant API
api:
  batch_delay: 0ms  # Send state changes immediately

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password

psram:
  speed: 80MHz
  
http_request:

