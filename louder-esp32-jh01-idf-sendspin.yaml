substitutions:
  name: esphome-web-8d19fc
  friendly_name: Chubb-01
  task_stack_in_psram: "true"

  # ===== Board-Specific Pinouts =====
  # I2S Audio 
  i2s_lrclk_pin: GPIO14
  i2s_bclk_pin: GPIO27
  i2s_dout_pin: GPIO26

  # TAS5805M
  tas58xx_variant: TAS5805M
  tas58xx_enable_pin: GPIO32
  i2c_sda_pin: GPIO25
  i2c_scl_pin: GPIO33

  # ===== DAC Overrides (optional) =====
  tas58xx_analog_gain: -15.5db
  tas58xx_volume_max: 0dB
  tas58xx_volume_min: -60dB

  # RGB LED
  rgb_led_pin: GPIO12
  num_leds: 1
  
  # Li-Po
  lipo_voltage_pin: GPIO36
  lipo_power_pin: GPIO39
  lipo_charge_pin: GPIO35

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.4
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  id: esp32_id
  variant: esp32
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1" 
    sdkconfig_options:
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: DEBUG

api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password

psram:
  speed: 80MHz
  
http_request:

packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esparagus-media-center
    ref: main
    files:
      - firmware/esphome/packages/dac-tas58xx.yaml
      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/audio-addon-external-dac.yaml
      - firmware/esphome/packages/sendspin.yaml
      - firmware/esphome/packages/sendspin-addon-dac-enable.yaml
      - firmware/esphome/packages/sendspin-addon-tas58xx.yaml
      - firmware/esphome/packages/sendspin-addon-esp32.yaml

      - firmware/esphome/packages/light.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml

binary_sensor:
  - platform: gpio
    name: Battery Ext Power
    pin: 
      number: $lipo_power_pin
      inverted: true

  - platform: gpio
    name: Battery Charging
    pin: 
      number: $lipo_charge_pin
      inverted: true

sensor:
  - platform: adc
    pin: $lipo_voltage_pin
    name: "Battery Voltage"
    update_interval: 50s
    attenuation: 6db
    filters:
      - multiply: 2.96 # (1M + 510K / 510K) voltage divider